name: IaC

# Varredura de segurança do Terraform a cada push e pull request.
# Bloqueia (exit 1) achados CRITICAL e HIGH. As exceções aceitas ficam junto do
# recurso, em comentários "#trivy:ignore:<ID>" com a justificativa, ou no
# .trivyignore.yaml. A checagem própria em .trivy/checks barra a porta do
# PostgreSQL aberta para a internet, que as regras padrão não cobrem.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Trivy 0.76.2 fixado por digest: a imagem não muda mesmo se a tag for reescrita.
  TRIVY_IMAGE: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  trivy-config:
    name: Varredura de IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Varredura de IaC com Trivy
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" config \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignorefile .trivyignore.yaml \
            --config-check .trivy/checks \
            --check-namespaces user \
            --format table \
            .
